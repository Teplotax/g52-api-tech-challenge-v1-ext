name: "3 - [HOM] Deploy & Promote"

on:
  pull_request:
    types: [closed]
    branches:
      - 'release/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy hom
    # só o merge develop -> release/* sobe hom
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: hom
      ref: ${{ github.event.pull_request.base.ref }}
    secrets: inherit

  # swagger publicado sai do contrato de hom
  deploy_docs:
    needs: deploy
    runs-on: ubuntu-latest
    environment: hom
    steps:
      - name: Download OpenAPI resolved spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-resolved-hom
          path: infra

      # /mailpit é só plumbing do ambiente, não vai pra documentação
      - name: Remove internal routes
        run: |
          jq 'del(.paths["/mailpit"], .paths["/mailpit/{proxy+}"])' infra/openapi-resolved.json > openapi.json

      - name: Push OpenAPI spec to docs repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git clone https://x-access-token:${{ secrets.DOCS_REPO_TOKEN }}@github.com/Teplotax/doc-${{ needs.deploy.outputs.api_name }}.git docs-repo
          cd docs-repo
          git fetch origin develop || true
          git checkout develop || git checkout -b develop
          cp ../openapi.json openapi.json
          git add openapi.json
          git commit -m "Update OpenAPI spec from $GITHUB_REPOSITORY@$GITHUB_SHA" || echo "No changes to commit"
          git push origin develop
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

  create:
    name: Create PR
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create PR (release -> main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_BRANCH="${{ github.event.pull_request.base.ref }}"

          EXISTS=$(gh pr list \
            --head "$RELEASE_BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTS" -eq "0" ]; then
            gh pr create \
              --base main \
              --head "$RELEASE_BRANCH" \
              --title "Promote $RELEASE_BRANCH → main" \
              --body "Automated promotion of $RELEASE_BRANCH into main"
          else
            echo "PR already exists. Skipping."
          fi
