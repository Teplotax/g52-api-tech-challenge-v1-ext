type: object
required:
  - grant_type
properties:
  grant_type:
    type: string
    enum:
      - client_credentials
  client_id:
    type: string
    description: Opcional se enviado no header Authorization (Basic)
    example: g52-oficina-admin
  client_secret:
    type: string
    description: Opcional se enviado no header Authorization (Basic)
